<!doctype html>
<!-- data-view / data-tabsbar seed the stylesheet's layout switches so the first paint is
     already correct; app.js and applySettings() keep them in sync from then on. -->
<html lang="en" data-view="board" data-tabsbar="top" data-side="full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Tab</title>
  <!-- sets the remembered sidebar mode and theme on <html> before first paint (no snap on load) -->
  <script src="js/boot.js"></script>
  <link rel="stylesheet" href="css/newtab.css">
</head>
<body>

  <div class="app">

    <aside class="side" id="sidebar">
      <div class="side-logo">
        <span class="logo-tile" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10a1 1 0 0 1 1 1v14l-6-3.4L6 19V5a1 1 0 0 1 1-1Z"/></svg>
        </span>
        <span class="logo-word">stacknest</span>
        <!-- desktop only: folds the sidebar to an icon rail (app.js, remembered); the drawer has its own close below -->
        <button class="icb side-collapse" id="side-collapse" type="button" aria-controls="sidebar" aria-expanded="true" title="Collapse sidebar" aria-label="Collapse sidebar">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M9.5 4.5v15"/><path d="m15.5 10-2 2 2 2"/></svg>
        </button>
        <button class="icb drawer-close" id="drawer-close" type="button" title="Close menu" aria-label="Close menu">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>

      <h2 class="side-nav-label" id="cap-views">Views</h2>
      <!-- #nav-library keeps NO count, by design: the whole Chrome tree is not an actionable number. -->
      <nav class="side-sec side-sec-nav" aria-labelledby="cap-views">
        <button class="navx view-link is-active" id="nav-collections" data-view="board" aria-current="page" title="Collections">
          <span class="nav-ic" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="7" height="15" rx="1.5"/><rect x="13.5" y="4.5" width="7" height="9" rx="1.5"/></svg></span>Collections
          <span class="nav-count" id="nav-collections-count"></span>
        </button>
        <button class="navx view-link" id="nav-myspace" data-view="myspace" title="My Space">
          <span class="nav-ic" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7.5 12 3.5l8 4v9L12 20.5 4 16.5Z"/><path d="M4 7.5 12 11.5l8-4"/><path d="M12 11.5v9"/></svg></span>My Space
          <span class="nav-count" id="nav-myspace-count"></span>
        </button>
        <button class="navx view-link" id="nav-vault" data-view="vault" title="Vault">
          <span class="nav-ic" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="9.5" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg></span>Vault
          <span class="nav-count" id="nav-vault-count"></span>
        </button>
        <button class="navx view-link" id="nav-library" data-view="library" title="Library">
          <span class="nav-ic" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4" width="17" height="4.5" rx="1.2"/><path d="M5.5 8.5v9a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2v-9"/><path d="M10 12.5h4"/></svg></span>Library
        </button>
        <button class="navx view-link" id="nav-tags" data-view="tags" title="Tags">
          <span class="nav-ic" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13 11 6h5a2 2 0 0 1 2 2v5l-7 7a1.6 1.6 0 0 1-2.3 0L4 15.3a1.6 1.6 0 0 1 0-2.3Z"/><circle cx="14" cy="10" r="1.15"/></svg></span>Tags
          <span class="nav-count" id="nav-tags-count"></span>
        </button>
        <button class="navx view-link" id="nav-duplicates" data-view="duplicates" title="Duplicates">
          <span class="nav-ic" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M4.5 15.5V6a1.5 1.5 0 0 1 1.5-1.5h9.5"/></svg></span>Duplicates
          <span class="nav-count" id="nav-duplicates-count"></span>
        </button>
        <button class="navx view-link" id="nav-notes" data-view="notes" title="Notes">
          <span class="nav-ic" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l5 5v11a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/><path d="M14 3v5h5"/><path d="m8.3 13 1.7 1.7L14 11"/></svg></span>Notes
          <span class="nav-count" id="nav-notes-count"></span>
        </button>
      </nav>

      <div class="side-scroll">
      <div class="side-sec" role="group" aria-labelledby="cap-spaces">
        <div class="side-label-row">
          <h2 class="side-label" id="cap-spaces">Spaces</h2>
          <button class="icb" id="new-space-btn" title="New space" aria-label="New space">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
        <div id="spaces-nav"></div>
      </div>

      <div class="side-sec" role="group" aria-labelledby="cap-collections">
        <div class="side-label-row">
          <h2 class="side-label" id="cap-collections">Collections<span class="side-label-scope" id="collections-scope"></span></h2>
          <div class="label-acts">
            <button class="icb" id="export-all-btn" title="Export this space’s collections (bookmarks .html)" aria-label="Export this space’s collections">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v11m0 0 4-4m-4 4-4-4"/><path d="M5 19h14"/></svg>
            </button>
            <button class="icb" id="new-collection-btn" title="New collection" aria-label="New collection">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </div>
        </div>
        <div id="collections-nav"></div>
      </div>

      <div class="side-sec side-sec-grow" role="group" aria-labelledby="cap-windows">
        <h2 class="side-label" id="cap-windows">Windows</h2>
        <div id="windows-root"></div>
      </div>
      </div>

      <div class="side-sec side-settings">
        <button class="navx view-link" id="nav-settings" data-view="settings" title="Settings">
          <span class="nav-ic" aria-hidden="true">
            <!-- 6-tooth gear generated from exact polar geometry: tips on r=8.6, valleys on
                 r=6.1, centred on (12,12). Six broad teeth stay crisp at 16px where finer
                 8-tooth cutting blurs together. Tips sit at top/bottom so the ink (incl. the
                 1.7 stroke) runs 2.55→21.45 vertically and 2.84→21.16 horizontally: ~2.6u
                 clear of every viewBox edge, and never clipped. -->
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9.52 6.43L9.77 3.69A8.6 8.6 0 0 1 14.23 3.69L14.48 6.43A6.1 6.1 0 0 1 15.59 7.06L18.08 5.92A8.6 8.6 0 0 1 20.31 9.77L18.07 11.36A6.1 6.1 0 0 1 18.07 12.64L20.31 14.23A8.6 8.6 0 0 1 18.08 18.08L15.59 16.94A6.1 6.1 0 0 1 14.48 17.57L14.23 20.31A8.6 8.6 0 0 1 9.77 20.31L9.52 17.57A6.1 6.1 0 0 1 8.41 16.94L5.92 18.08A8.6 8.6 0 0 1 3.69 14.23L5.93 12.64A6.1 6.1 0 0 1 5.93 11.36L3.69 9.77A8.6 8.6 0 0 1 5.92 5.92L8.41 7.06A6.1 6.1 0 0 1 9.52 6.43Z"/><circle cx="12" cy="12" r="2.7"/></svg>
          </span>Settings
        </button>
      </div>

    </aside>

    <div class="main">
      <header class="top">
        <button class="icb drawer-btn" id="drawer-btn" title="Menu" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="view-heading">
          <span class="view-kicker" id="view-kicker">Saved tabs</span>
          <h1 class="view-title" id="view-title">Collections</h1>
        </div>
        <div class="mobile-quick-actions">
          <button class="icb mobile-theme-cycle" id="mobile-theme-cycle" type="button" title="Change theme" aria-label="Change theme">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17" fill="currentColor" stroke="none"/></svg>
          </button>
          <button class="icb mobile-stash" id="mobile-stash-window-btn" type="button" title="Stash this window and close its tabs" aria-label="Stash this window and close its tabs">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8"/><path d="M10 12h4"/></svg>
          </button>
        </div>

        <label class="searchbox" for="search">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
          <input id="search" type="text" autocomplete="off" spellcheck="false"
                 placeholder="Search your workspace…" aria-label="Search tabs, collections and bookmarks">
          <span class="kbd-pair" aria-hidden="true"><kbd>⌘</kbd><kbd>K</kbd></span>
          <button class="icb search-clear" id="search-clear" type="button" title="Clear search" aria-label="Clear search">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </label>

        <div class="ticker" id="ticker" hidden aria-label="Market prices"></div>

        <div class="top-actions">
          <div class="theme-seg theme-choice-seg" role="group" aria-label="Theme">
            <button class="chipx" id="theme-auto" data-theme-choice="auto" aria-pressed="false" title="Follow system theme" aria-label="Follow system theme">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17" fill="currentColor" stroke="none"/></svg>
            </button>
            <button class="chipx" id="theme-light" data-theme-choice="light" aria-pressed="false" title="Light theme" aria-label="Light theme">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6 19 19M19 5l-1.4 1.4M6.4 17.6 5 19"/></svg>
            </button>
            <button class="chipx" id="theme-dark" data-theme-choice="dark" aria-pressed="false" title="Dark theme" aria-label="Dark theme">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4 7 7 0 1 0 20 14.5Z"/></svg>
            </button>
            <button class="chipx" id="theme-linen" data-theme-choice="linen" aria-pressed="false" title="Linen theme — warm paper, pine accent" aria-label="Linen theme">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5C8.8 7.6 6.5 10.6 6.5 13.5a5.5 5.5 0 0 0 11 0c0-2.9-2.3-5.9-5.5-10Z"/><path d="M9.5 14.5a2.5 2.5 0 0 0 2 2.4"/></svg>
            </button>
          </div>
          <div class="window-acts" role="group" aria-label="This window">
            <button class="btnx ghosty" id="save-all-btn" type="button" title="Save this window’s tabs to a new collection — keeps them open" aria-label="Save window — keeps its tabs open">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v10m0 0 3.5-3.5M12 13l-3.5-3.5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
              Save window
            </button>
            <!-- Deliberately NOT .primary: this one closes your tabs. The app's loudest
                 affordance should not be its destructive one. -->
            <button class="btnx soft" id="stash-window-btn" type="button" title="Save this window's tabs to a collection and close them — frees memory">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8"/><path d="M10 12h4"/></svg>
              Stash &amp; close
            </button>
          </div>
        </div>
      </header>

      <!-- The open-tabs bar. ONE element with two homes: horizontal mode leaves it here,
           under the header inside .main; vertical mode moves it out to sit between the
           sidebar and .main as its own rail (see mountTabsBar() in js/app.js). Same
           markup, same ids, same render path — only the parent and the axis change. -->
      <div class="tray" id="tabs-bar">
        <div class="tray-live">
          <span class="pulse" aria-hidden="true"><span></span><span></span></span>
          <div class="tray-live-copy">
            <span class="tray-label">Live</span>
            <span class="tray-count" id="tray-count"><span class="tray-num">0</span><span class="tray-unit"> open tabs</span></span>
          </div>
        </div>
        <div class="tray-chips" id="tray-root"></div>
      </div>

      <section class="view view-board" id="view-board">
        <!-- The board's head is static markup (spaces.js refills #board-state on every render):
             it never scrolls with the columns, so the layout segment, export and the one
             primary stay put while the board scrolls sideways underneath. -->
        <div class="sec-top board-top">
          <header class="sec-head">
            <p class="sec-state" id="board-state"></p>
            <div class="sec-tools">
              <div class="theme-seg viewmode-seg" id="viewmode-seg" role="group" aria-label="Board layout">
                <button class="chipx" id="view-columns" aria-pressed="false" title="Column layout" aria-label="Column layout">
                  <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="6" height="14" rx="1.2"/><rect x="14" y="5" width="6" height="14" rx="1.2"/></svg>
                </button>
                <button class="chipx" id="view-tiles" aria-pressed="false" title="Tile layout" aria-label="Tile layout">
                  <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="1.4"/><rect x="13" y="4" width="7" height="7" rx="1.4"/><rect x="4" y="13" width="7" height="7" rx="1.4"/><rect x="13" y="13" width="7" height="7" rx="1.4"/></svg>
                </button>
                <button class="chipx" id="view-mosaic" aria-pressed="false" title="Mosaic layout — collections as a masonry of cards" aria-label="Mosaic layout">
                  <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="7" height="9" rx="1.4"/><rect x="13" y="4" width="7" height="5" rx="1.4"/><rect x="13" y="11" width="7" height="9" rx="1.4"/><rect x="4" y="15" width="7" height="5" rx="1.4"/></svg>
                </button>
              </div>
              <button class="icb" id="board-export-btn" type="button" title="Export this space’s collections (bookmarks .html)" aria-label="Export this space’s collections">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v11m0 0 4-4m-4 4-4-4"/><path d="M5 19h14"/></svg>
              </button>
              <div class="sec-next">
                <button class="btnx primary" id="board-new-btn" type="button">
                  <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                  New collection
                </button>
              </div>
            </div>
          </header>
        </div>
        <div class="board-scroll"><div class="board" id="board-root"></div></div>
      </section>

      <section class="view view-myspace" id="view-myspace" hidden>
        <div class="view-body" id="myspace-root"></div>
      </section>

      <section class="view view-vault" id="view-vault" hidden>
        <div class="view-body" id="vault-root"></div>
      </section>

      <section class="view view-library" id="view-library" hidden>
        <div class="view-body" id="bookmarks-root"></div>
      </section>

      <section class="view view-tags" id="view-tags" hidden>
        <div class="view-body" id="tags-root"></div>
      </section>

      <section class="view view-duplicates" id="view-duplicates" hidden>
        <div class="view-body" id="duplicates-root"></div>
      </section>

      <section class="view view-notes" id="view-notes" hidden>
        <div class="view-body" id="notes-root"></div>
      </section>

      <section class="view view-settings" id="view-settings" hidden>
        <div class="view-body" id="settings-root"></div>
      </section>
    </div>
  </div>

  <div class="drawer-scrim" id="drawer-scrim" aria-hidden="true"></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="undo-bar" class="undo-bar" role="status" aria-live="polite" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
